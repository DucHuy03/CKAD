# Namespace-wide ceiling prevents one exercise from exhausting the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: movie-booking-quota
  namespace: movie-booking
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    persistentvolumeclaims: "6"
