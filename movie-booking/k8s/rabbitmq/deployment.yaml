# deployment.yaml - RabbitMQ.
#
# CO Y DUNG "rabbitmq:3.13-management" (Debian-based), KHONG dung ban
# "-alpine": o Phase 1 (docker-compose) da gap loi that su
# "Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces" voi ban
# alpine tren Docker Desktop, do van de permission voi lop filesystem ao
# hoa (gRPC-FUSE/VirtioFS). Vi k8s cua Docker Desktop chay TRONG CUNG 1 VM
# do, rui ro gap lai loi tuong tu la co that - dung luon ban Debian tu dau
# de tranh phai debug lai van de da biet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          envFrom:
            - secretRef:
                name: rabbitmq-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          # RabbitMQ's Erlang VM can take well over 60s to finish starting
          # under load; readiness/livenessProbe alone raced that and killed
          # the container mid-startup. startupProbe holds off both until
          # the AMQP port accepts connections, up to 150s, before they take over.
          #
          # tcpSocket, not exec "rabbitmq-diagnostics -q ping": Docker
          # Desktop's CRI exec channel is known to fail intermittently with
          # "http: server gave HTTP response to HTTPS client" (breaks
          # kubectl exec too, not just probes) - an exec probe on this
          # cluster can crash-loop a perfectly healthy RabbitMQ. TCP accept
          # on 5672 is a weaker signal than a real AMQP ping, but it's the
          # one that doesn't depend on a broken code path.
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data