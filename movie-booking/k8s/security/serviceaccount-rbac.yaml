# This service account is intentionally scoped to read Pod status only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-observer
  namespace: movie-booking
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booking-observer
  namespace: movie-booking
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booking-observer
  namespace: movie-booking
subjects:
  - kind: ServiceAccount
    name: booking-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: booking-observer
