apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: movie-booking
data:
  DB_HOST: postgres-notification
  DB_PORT: "5432"
  DB_NAME: notification_service
  DB_SSLMODE: disable
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  MAIL_FROM: "booking@movie-booking.local"
  HTTP_PORT: "8080"
  LOG_FILE_PATH: /var/log/app/app.log