# Internal backend used to verify Service selectors and Endpoints.
apiVersion: apps/v1
kind: Deployment
metadata: { name: lab41-backend, namespace: lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: lab41-backend } }
  template:
    metadata: { labels: { app: lab41-backend } }
    spec:
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
---
# ClusterIP is the in-cluster service; NodePort demonstrates external exposure.
apiVersion: v1
kind: Service
metadata: { name: lab41-backend, namespace: lab }
spec:
  selector: { app: lab41-backend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: lab41-frontend, namespace: lab }
spec:
  type: NodePort
  selector: { app: lab41-backend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30081 }]
