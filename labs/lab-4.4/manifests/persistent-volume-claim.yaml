# A 1Gi claim is mounted by a writer Pod; delete/recreate the Pod to prove persistence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: lab44-data, namespace: lab }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Pod
metadata: { name: lab44-writer, namespace: lab }
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: [sh, -c, 'date >> /data/history.txt; sleep 3600']
      volumeMounts: [{ name: data, mountPath: /data }]
      resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 100m, memory: 128Mi } }
  volumes: [{ name: data, persistentVolumeClaim: { claimName: lab44-data } }]
