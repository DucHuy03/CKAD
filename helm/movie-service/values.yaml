# One chart, one values file, five services. `serviceName` picks which
# entry under `services:` gets deployed by this release (defaults to
# movie-service so `helm install foo .` with no flags still works, e.g. Lab
# 5.4). To deploy a different service:
#   helm install lab54-booking . -n <namespace> --set serviceName=booking-service
#
# Override image.tag at install/upgrade time; never use latest in a release.
serviceName: movie-service

# &defaults holds the fields identical across all five services (same
# container port, same requests/limits in every k8s/<service>/deployment.yaml
# "app" container) so each entry below only states what's actually different.
defaults: &defaults
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

services:
  movie-service:
    <<: *defaults
    image: { repository: movie-service, tag: "1.0.0", pullPolicy: IfNotPresent }
    existingSecret: movie-service-secret
    configMapName: movie-service-config
  api-gateway:
    <<: *defaults
    image: { repository: api-gateway, tag: "1.0.0", pullPolicy: IfNotPresent }
    existingSecret: api-gateway-secret
    configMapName: api-gateway-config
  booking-service:
    <<: *defaults
    image: { repository: booking-service, tag: "1.0.0", pullPolicy: IfNotPresent }
    existingSecret: booking-service-secret
    configMapName: booking-service-config
  payment-service:
    <<: *defaults
    image: { repository: payment-service, tag: "1.0.0", pullPolicy: IfNotPresent }
    existingSecret: payment-service-secret
    configMapName: payment-service-config
  notification-service:
    <<: *defaults
    image: { repository: notification-service, tag: "1.0.0", pullPolicy: IfNotPresent }
    existingSecret: notification-service-secret
    configMapName: notification-service-config
