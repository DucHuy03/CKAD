# Override image.tag at install/upgrade time; never use latest in a release.
replicaCount: 1
image:
  repository: movie-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8080
existingSecret: movie-service-secret
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }
